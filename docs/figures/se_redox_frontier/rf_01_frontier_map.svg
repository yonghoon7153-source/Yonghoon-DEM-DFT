   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="256.973607" y="222.475677" transform="rotate(-0 256.973607 222.475677)">P–S bonding (PS₄)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65a30d" x="256.973607" y="244.022976" transform="rotate(-0 256.973607 244.022976)">Cl 3p</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #be123c" x="256.973607" y="267.227759" transform="rotate(-0 256.973607 267.227759)">O 2p (P–O bonding)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="256.973607" y="119.711636" transform="rotate(-0 256.973607 119.711636)">P–S σ* (antibonding)</text>

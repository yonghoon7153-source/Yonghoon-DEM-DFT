[pytest]
# importlib import mode lets two test files share a basename
# (packages/wrdkit/tests/test_composition.py and
# apps/api/tests/test_composition.py) without pytest treating them as one
# module. The default prepend mode collides on the first duplicate.
addopts = --import-mode=importlib -q
testpaths = packages/wrdkit/tests apps/api/tests
python_files = test_*.py

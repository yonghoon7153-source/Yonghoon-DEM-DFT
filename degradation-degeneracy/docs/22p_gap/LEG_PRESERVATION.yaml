영향:
  안_바뀌는_것:
  - 전이표(131/436/55/854 · 381/186/167/742)는 커밋된 투영에서 재계산된다
  - 후보 구성(base_init → warm slot 교체)도 restart 투영에서 재계산된다
  - random-only 다봉성도 restart 투영에서 재계산된다
  - 8다리의 summary·manifest·투영 digest 자기정합은 그대로 검사된다
  바뀌는_것:
  - 7다리는 투영을 원자료에서 **다시 만들 수 없다** — 영구 diagnostic
  - '`validate_provenance` 는 7다리에서 영구 불가'
  - 투영에 없는 열(p_spread · 경계 플래그 세부 · restarts_json 전문) 영구 손실
  - 계약 §9 의 재실행에서 그 7다리는 '재실행' 이 아니라 '새로 생성' 이다
  - analyzer 세대가 올라가면 g1 은 따라올 수 없다 — 그래서 cohort 를 나눈다. 교차-다리 비교는 g1 안에서만 성립한다.
  교훈:
  - 보존 도구는 있었다. 없었던 것은 **강제**다. `archive_bundle` 을 통과하지 않은 다리가 존재할 수 있는 한 같은 사고가 반복된다.
    계약 v4 묶음 9 는 다리 생성을 트랜잭션으로 만든다 — 보존 영수증 없이는 등록 자체가 실패한다.

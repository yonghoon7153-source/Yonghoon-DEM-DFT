# Type-check, validate the JSON database, and make sure the site builds on every push / PR.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run typecheck
      - run: npm run build

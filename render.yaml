services:
  - type: web
    name: dem-analyzer
    runtime: python
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: cd webapp && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # ── 인증 게이트 (코드리뷰 F-01) ───────────────────────────────────────
      # 이 서비스는 0.0.0.0 에 바인딩된 **공개** web service 인데 여태 인증이 없어
      # 외부에서 /upload · /analyze · /delete · archive 변경 · predictor 학습이
      # 그대로 호출됐다 (서버는 Supabase service-role key 를 쥐고 있다).
      #
      # REQUIRE_AUTH=1 이면 게이트가 켜지고, 토큰이 없으면 **쓰기가 전부 503 으로
      # 잠긴다** (fail-closed).  즉 아래 WEBAPP_AUTH_TOKEN 을 Render 대시보드에서
      # 넣기 전까지 이 인스턴스는 **읽기 전용**이다 — 의도된 동작이다.
      - key: WEBAPP_REQUIRE_AUTH
        value: "1"
      # ★ 값은 커밋하지 않는다.  sync:false = Render 대시보드에서 직접 입력.
      #   충분히 긴 무작위 문자열을 쓸 것 (예: openssl rand -hex 24).
      - key: WEBAPP_AUTH_TOKEN
        sync: false
      # Render 는 HTTPS 로 서비스하므로 세션 쿠키에 Secure 를 붙인다.
      - key: WEBAPP_HTTPS
        value: "1"

# ⚠ 이 게이트로 **덮이지 않는** 것 (리뷰 잔여 위험 — 별도 작업 필요):
#   • rate limit / 동시 실행 제한 / 업로드 개수·형식 제한 (MAX_CONTENT_LENGTH 는 2 GB)
#   • F-07 batch·predictor 상태가 프로세스 로컬 (workers=2 에서 불일치)
#   • F-08 Supabase 재귀·pagination 삭제, rename/move 원격 미갱신
#   • F-09 startup restore 가 worker 마다 중복 실행 + 비원자적 다운로드
#   • mpm_lab/ 은 persistent disk 도 Supabase sync 도 없음 → 재배포 시 소실
#   진짜 경계는 애플리케이션이 아니라 배포 ingress 에 두는 편이 낫다.

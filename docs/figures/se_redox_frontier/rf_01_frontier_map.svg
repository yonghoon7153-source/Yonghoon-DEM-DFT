   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0284c7" x="256.973607" y="93.191414" transform="rotate(-0 256.973607 93.191414)">B–S σ*</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #be123c" x="256.973607" y="56.726755" transform="rotate(-0 256.973607 56.726755)">P–O σ*</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 124.252077)">Oxidation:</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 138.655358)">take one electron out</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 153.058639)">from the top (free S²⁻)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 52.980242)">Reduction:</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 67.383523)">put one electron in</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f2937" transform="translate(9.166721 81.786804)">at the bottom (P–S σ*)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(88.596901 313.891508)">Ordering only (schematic). Voltages come from thermodynamics</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(168.528229 327.094515)">(grand potential), not from the gap.</text>
   </g>

name: wiki-lint
on:
  push:
    paths: ["wiki/**"]
  pull_request:
    paths: ["wiki/**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 wiki/tools/lint.py

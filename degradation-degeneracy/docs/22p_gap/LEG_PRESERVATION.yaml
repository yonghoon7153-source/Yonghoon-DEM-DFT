    blacklist 를 늘리는 대신 **경로 인자를 없앴다** (`attempt_path_for()` 가 유도한다). 그러면서 도달 불가가 된 검사 둘을 실측하고 지웠다. (3)
    P0-5 — 55차 형태 durable state 에 `attempt_verifier` 가 없어 `migrate_legacy_finalized_leg()` 로 버전화했다. (4)
    P0-6/P0-7 — producer 닫힘이 **철자 blacklist** 였다. 이름이 아니라 capability 를 따라가도록 `_namespace_capabilities()`
    로 뒤집고, import-time 계산(decorator·default·annotation·base)을 `_import_time_heads()` 로 닫힘에 넣었다. (5) P0-2/3/4·P1-4
    — mount 정체를 mountinfo 행 순서와 pathname 깊이로 **추측**했다. 겹쳐 쌓인 mount 는 깊이가 같아 아래 것이 뽑혔다(반례 실측). 추측을 정교화하지
    않고 없앴다: `_kernel_mount_id()` 로 커널에 묻고 `_fs_identity()` 로 `(dev, filesystem 안의 경로)` 좌표에서 비교하며 `_names_for()`
    는 창을 하나 고르지 않는다. (6) P1-2 — 재생이 보는 환경을 선언한 것만 남기고 지웠다(`replay_env()`). (7) P1-3 — 멱등성 물음을 임계 구역 안으로
    옮겨 finalize 를 선형화했다. 이 수정들로 `compute_sha256` 이 `872ca5b9046ca703` → `044a87204bfca078`, `producer_semantic_sha256`
    이 `eb4555abd9490dd0` → `ad36d111337abd39` 로 움직였다. 계약 §13.3.2 대로 pin 은 cohort lifetime 동안 고정이므로 g11
    을 얼리고 `g12_2026_09_03` 로 간다. **행 바이트는 안 움직였다** — 움직인 것은 identity 의 정의다.'
  행_바이트가_같은가: 같다. `projection_sha256` · `restart_projection_sha256` · `fits_sha256` 이 g11 과 바이트 동일하다 (57차
    변경은 전부 신뢰 경계 선언·경로 유도·capability 닫힘·mount 좌표·환경 정화·임계 구역이고 계산식이 아니다). 그래도 **cross-cohort 비교는 금지**다
    — 같은 바이트라는 사실은 회귀가 확인하는 것이지 인용의 근거가 아니다.

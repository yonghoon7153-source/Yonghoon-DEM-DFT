    legs: [paired_fixed5_v4]

  # ── 2026-08-28 (48차) — producer identity 정의가 바뀌어 **새 cohort** ──────
  - cohort_id: g3_2026_08_28
    dir: docs/22p_gap/proj_g3
    status: active
    prospective_legs: []
    cross_leg_comparison: not_applicable_single_leg
    무엇이_달라졌나: >-
      **행 바이트가 아니라 producer identity 의 정의가 바뀌었다.** 48차 게이트
      리뷰(47차 조건 P0-2)가 47차 `producer_semantic_sha256` 의 네 구멍을
      짚었고, 넷을 다 막으면서 값이 `908503e65162e7d9` →
      `bbb1c4d6fc982610` 로 움직였다:

      (1) 닫힘이 `row_projection.py` 안에서 멈춰 `src.scoring` 의 채점 함수를
          안 봤다 — 채점 의미를 통째로 바꿔도 digest 가 안 움직였다.
      (2) `ast.get_source_segment` 이 `decorator_list` 를 버렸다 —
          `@lru_cache` 를 붙이고 떼도 같은 값이었다.
      (3) `_PRODUCER_CUT` 이 **넓어지는** 것은 막히지 않았다 (좁아지는 것만
          fail-closed 였다).
      (4) 정규형이 인터프리터 버전에 묶여 있었다. 실측: 같은 바이트에 대해
          3.11 `908503e65162e7d9` · 3.12 `d4ae1c027b434e83` ·
          3.13 `aa1cf2cf045c41ea` — 세 값이었다. 지금은 3.10~3.13 이
          같은 값을 낸다 (회귀가 이 기계에서 대조한다).

      계약 §13.3.2 대로 pin 은 cohort lifetime 동안 고정이므로 g2 를 얼리고
      **새 cohort ID + 새 출력 디렉터리**로 간다. g2 의 바이트와 pin 은
      그대로 두었다 — 얼린 것을 손대지 않는다.
    행_바이트가_같은가: >-
      같다. `projection_sha256` · `restart_projection_sha256` · `fits_sha256`
      이 g2 와 바이트 동일하다 (48차 변경은 전부 identity 정의·게이트 배선이고
      계산식이 아니다). 그래도 **cross-cohort 비교는 금지**다 — 같은 바이트라는
      사실은 회귀가 확인하는 것이지 인용의 근거가 아니다.
    pin:
      schema_version: 3
      compute_sha256: 48c85e8ada431242
      row_projection_py_sha256: 154bd3764b15539c
      src_scoring_py_sha256: 69e69cb046f4b4ae
      analysis_spec_sha256: 43d74dd385b1f66d28cc371dd7ebbd00fc0289323e0a515114eb2b8d45d56271
      producer_semantic_sha256: bbb1c4d6fc982610
    runtime: {python: "3.11.15", pandas: "3.0.5", pyarrow: "25.0.1",
              numpy: "2.4.6", yaml: "6.0.3"}
    legs: [paired_fixed5_v4]



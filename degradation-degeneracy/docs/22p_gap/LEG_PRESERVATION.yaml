# warm-probe 8다리의 **실제 보존 상태** — 계약 v3 §8 의 3축 실체
#
# 왜 이 파일이 있나 (2026-08-24):
#   작업 기계가 교체되면서 `results/` 가 사라졌다. 그 전까지 문서는 8다리를
#   전부 "원자료 보유 기계에서 되살릴 수 있다" 로 적고 있었고, 24차 요청문도
#   그렇게 썼다. **틀린 상태가 문서에 있었다.**
#
#   복구 전수 조사에서 `paired_fixed5_v4` 하나만 살아남았다 (2026-08-16
#   백업 `v4_run_extras`). 나머지 7다리는 2026-08-20 에 만든 warm 실험이라
#   그 백업 이후이고, 네 곳(WSL 홈 · D 드라이브 2곳 · C 드라이브)을 전부
#   뒤졌지만 없다.
#
# ★ 24차 **보충** 리뷰 (2026-08-24, NO-GO) 가 이 파일의 초판을 4건으로 반려했다.
#   초판이 틀린 것:
#     1. `inference_role: canonical_candidate` — 계약 §8 에 없는 값을 원장과
#        회귀가 임의로 만들었다. 계약을 고친 것이 아니라 **회귀를 두 번째
#        authority 로 만든** 것이다. 직전 라운드 Q5 가 경고한 "구조적 literal
#        의 독립 복제" 가 같은 커밋에서 바로 재발했다. → 값을 버렸다.
#        회귀는 이제 enum 을 계약에서 읽는다
#        (`test_status_axis_enums_have_exactly_one_authority`).
#     2. 7다리를 `missing` 이라 적었다. 계약 §8 은 그 상태에 이미
#        `recorded_projection` 이라는 칸을 갖고 있다 (투영·summary·manifest 는
#        커밋돼 있고 원자료 독립 재계산만 불가). → 고쳤다.
#     3. `근거` 산문만 있고 검증 가능한 anchor 가 없었다. → `evidence` 블록.
#     4. 어느 주장에 쓰이는 다리인지 없었다. → `claim_roles`.
#
# ★ 사고 원인의 정정 (보충 리뷰가 바로잡았다):
#   초판은 "보존 단위를 아직 안 세웠기 때문" 이라고 적었다. **틀렸다.**
#   `tools/archive_bundle.py` · `scripts/archive_results.sh` · git `artifacts/`
#   체계는 이미 있었고 `paired_fixed5_v4` 에서 실제로 작동했다 (아래 evidence
#   가 그 산물이다). 실패는 도구 부재가 아니라 **8월 20일 warm 다리 7개에 그
#   체계를 필수 gate 로 적용하지 않은 coverage·운영 문제**다. 계약 v4 가 고칠
#   것은 "보존 도구를 만든다" 가 아니라 "다리 생성이 보존 없이 끝날 수 없게
#   한다" 이다.
#
# 이 파일은 관측 기록이지 계획이 아니다. 원자료가 더 발견되면 갱신한다.
# 3축 enum 의 정본은 `STAGE3_CONTRACT.md` §8 하나다 — 여기 옮겨 적지 않는다.
schema_version: 2

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240" role="img" aria-label="Nd3+ with three unpaired 4f electrons acts as a small magnet; nearby P is shifted or broadened">
<style>
text{font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#1f2937}
.mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:14px}
.note{font-size:13.5px;fill:#6b7280}
.li{fill:#0d9488} .p{fill:#7c3aed} .nd{fill:#db2777} .fld{fill:#2563eb} .wht{fill:#ffffff}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.guide{stroke:#6b7280;stroke-width:1;stroke-dasharray:3 4;fill:none}
.trace{fill:none;stroke-width:2.2;stroke-linejoin:round}
</style>
<rect x="0.5" y="0.5" width="539" height="239" rx="8" fill="#ffffff" stroke="#d3dcdc"/>
<defs><marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<circle cx="150" cy="105" r="52" fill="none" stroke="#db2777" stroke-dasharray="2 4"/>
<circle cx="150" cy="105" r="80" fill="none" stroke="#db2777" stroke-dasharray="2 4" opacity="0.7"/>
<circle cx="150" cy="105" r="26" fill="#db2777"/>
<line x1="138" y1="118" x2="138" y2="92" stroke="#ffffff" stroke-width="2" marker-end="url(#an)"/>
<line x1="150" y1="118" x2="150" y2="92" stroke="#ffffff" stroke-width="2" marker-end="url(#an)"/>
<line x1="162" y1="118" x2="162" y2="92" stroke="#ffffff" stroke-width="2" marker-end="url(#an)"/>
<text class="nd" x="150" y="208" text-anchor="middle">Nd³⁺ · 4f³</text>
<text class="note" x="150" y="228" text-anchor="middle">3 unpaired electrons</text>
<circle cx="200" cy="70" r="12" fill="#7c3aed"/>
<text class="p" x="236" y="64">P nearby</text>
<text class="note" x="236" y="86">peak shifted or broadened</text>
<circle cx="440" cy="150" r="12" fill="#7c3aed"/>
<text class="p" x="440" y="186" text-anchor="middle">P far away</text>
<text class="note" x="440" y="208" text-anchor="middle">unchanged</text>
</svg>

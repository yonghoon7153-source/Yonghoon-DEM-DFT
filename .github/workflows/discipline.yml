# 규율 검사 — 세 검사기를 **기계가** 돌린다.
#
# ★ 왜 (Codex ⑨ · CLAUDE.md 작업 규율 ④): 우리는 정본·원장·금지어를 강제하는 검사기를 셋
#   갖고 있는데 **전부 수동**이었다.  그래서 2026-08-12 에 반증된 값이 08-19 신규 문서에서
#   재주장되고, 독립 리뷰가 그것을 낡은 정본에 대조해 "일치" 로 통과시켰다.  사람이 기억해서
#   돌리는 검사는 잊히는 순간 없는 것과 같다.
#
# ⚠ 이 워크플로는 **GPU·솔브를 돌리지 않는다** — 초소형 픽스처 스모크(규칙 J)와 정적 검사뿐이라
#   수 분이면 끝난다.  실험 런은 여전히 kgy 에서 사람이 돌린다.
name: discipline

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 검사기가 `claimed_fixed_sha` 가 **이 리포에 실재하는 커밋인지** 본다 →
          # 얕은 클론이면 옛 SHA 를 못 찾아 거짓 실패한다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 (검사기가 실제로 쓰는 것만)
        #  ⚠ flask·requests 는 웹앱 테스트가 **import 단계에서** 쓴다
        #    (`app.py` → `storage_sync.py` → `requests`).  이 줄에 없으면 깨끗한
        #    러너에서 5개가 전부 import 에서 죽는다 — 배선해 놓고 안 도는 상태였다
        #    (Codex R19 Q6 P2).  이제 `check_selftest_inventory` 가 의존 폐포를
        #    계산해 이 줄과 대조하므로, 빠지면 검사가 잡는다.
        run: python -m pip install --quiet numpy scipy matplotlib flask requests

      - name: 실행 계약 단일 출처 (selftest)
        run: python scripts/run_contract.py --selftest

      - name: 원장 자기일관성 + 철회값 스윕 (selftest)
        run: python scripts/check_review_findings.py --selftest

      - name: 원장 자기일관성 + 철회값 스윕 (리포 실물)
        run: python scripts/check_review_findings.py

      - name: 방법 규율 A~M (selftest — 음성 대조 포함)
        run: python scripts/check_method_discipline.py --selftest

      - name: 방법 규율 A~M (리포 실물 — 규칙 J·L 은 엔트리포인트·러너를 실제로 돌린다)
        run: python scripts/check_method_discipline.py

      - name: 사전등록 판정기 (selftest)
        run: python scripts/sdcp_gain_verdict.py --selftest

      - name: 상별 부피 원장 캐시 매칭 (selftest)
        run: python scripts/sdcp_phase_ledger_match.py --selftest

      # ★★ 2026-08-25 (CDXR3-8/⑩) — S1 봉인의 핵심 셋이 CI 에서 **안 돌고 있었다**.
      #   팔 검사기(check_arm)·PTFE 규약·솔버 규약.  셋 다 1초 미만이다.
      #   규칙 K 가 check_all.sh 와 이 파일을 대조해 재발을 막는다.
      - name: 팔 검사기 · 스탬프 비교 (selftest)
        run: python scripts/sr01_stamp_compare.py --selftest

      - name: payload 규약 (온도 · PTFE 스탬프) (selftest)
        run: python scripts/mpm_webapp_payload.py --selftest-temperature

      - name: STEP3 솔버 규약 (selftest)
        run: python scripts/step3_sigma.py --selftest

      - name: 팔 payload 축소본 계약 (selftest)
        run: python scripts/reduce_arm_payloads.py --selftest

      - name: 접점 분포 그림 — 라벨·규약 계약 (selftest)
        run: python scripts/plot_cbd_contacts.py --selftest

      - name: σ_e 막대 그림 — 단위·팔 대응 계약 (selftest)
        run: python scripts/plot_sigma_e_bars.py --selftest

      - name: A 트랙 판정식 (절댓값 · 부호반전 회귀) (selftest)
        run: python scripts/bridge_grid_verdict.py --selftest

      # ★★ LHS 확장 분석기 둘 (2026-08-29, Codex R11 B1) — 결과가 나오기 **전에** 배선한다.
      #   런이 끝난 뒤 분석기를 짜면 규약이 데이터를 보고 정해지고, 그때는 사전등록이 아니다.
      - name: LHS 퍼콜 추출기 (그래프 규약 · 경계 fixture) (selftest)
        run: python scripts/lhs_perc_extract.py --selftest

      - name: LHS 문턱 적합기 (Firth · 프로파일 구간 · 예외 규칙) (selftest)
        run: python scripts/lhs_perc_fit.py --selftest

      # ★★ 2026-08-31 — LHS 확장 제출 도구 셋.  설계 봉인이 CI 에서 매번 재검증된다.
      - name: LHS 확장 설계 생성기 (LHS 점유 · 소수 seed · 절대 칸) (selftest)
        run: python scripts/lhs_ext_design.py --selftest

      - name: LHS 확장 덱 재료화 (템플릿 왕복 · 가중 합 1) (selftest)
        run: python scripts/lhs_ext_materialize.py --selftest

      - name: LHS 확장 제출 게이트 (상태를 센다 — 총수가 아니라) (selftest)
        run: python scripts/lhs_ext_submit_gate.py --selftest

      - name: 봉인 설계 ↔ 상자 ↔ 해시 (리포 실물)
        run: >
          python scripts/lhs_ext_design.py
          --verify docs/data/lhs_ext_design_v2_20260829.csv
          --box docs/data/lhs_ext_box_v2_20260829.json
          --expect-sha256 bc72b8bf274842b7c54e319ceac70f5cb2804aa3635f329dfed34697bd52ea19

      # ★★ 2026-08-31 — 문서가 없는 파일·없는 커밋을 가리키는 자리를 잡는다.
      #   ⚠ `fetch-depth: 0` 이 필수다 — 얕은 클론이면 SHA 실재 확인이 무의미해진다.
      - name: 문서 참조 실재 (경로 · 커밋) (selftest)
        run: python scripts/check_doc_refs.py --selftest

      - name: 문서 참조 실재 (리포 실물)
        run: python scripts/check_doc_refs.py --quiet

      # ★★ 2026-08-31 — 웹앱 테스트 5개가 **어디에도 배선돼 있지 않았다**.
      #   그래서 둘이 빨간불인 채로 남아 있었고, 그중 하나는 앱이 철회 게이트로
      #   **더 안전해졌기 때문에** 난 실패였다.  돌지 않는 검사는 없는 것과 같다.
      - name: 웹앱 — 파이프라인 provenance
        run: python webapp/test_pipeline_provenance.py

      - name: 웹앱 — 예측기 UI · σ_grain
        run: python webapp/test_predictor_ui_and_sigma_grain.py

      - name: 웹앱 — 보안 Phase A
        run: python webapp/test_security_phase_a.py

      - name: 웹앱 — 세미나 페이지 (철회 게이트 계약)
        run: python webapp/test_seminar_page.py

      - name: 웹앱 — 온도 · 압력 배선
        run: python webapp/test_temp_pressure_wiring.py

      #  ★★ 2026-09-01 (Codex R19 Q6) — 어디에서도 안 돌던 검사기 72개.
      #    손목록을 여기 72줄 적으면 또 낡으므로, 드라이버가 등재를 읽고 돈다.
      - name: 자기검사 등재 (분류 · 레인 · CI 의존 폐포)
        run: python scripts/check_selftest_inventory.py --quiet

      - name: fast 자기검사 전수 (등재 기반 드라이버)
        run: python scripts/check_selftest_inventory.py --run-fast

      - name: 세미나 화면 DOM 회귀 (거부가 화면에 뜨는가)
        run: node webapp/test_seminar_dom.mjs

      #  ★ 2026-09-02 — 이 검사는 `check_all` 에만 있고 **CI 에는 없었다** (규칙 K 의
      #    손목록이 못 보는 자리).  그 사이 컬러바 **눈금**이 51개 겹쳐 찍혀 SI 그림이
      #    읽을 수 없게 export 됐다 — 제목만 보던 검사에 눈금 축을 합쳤으니, 이제
      #    양쪽 레인에서 돈다.  ⚠ 값이 맞고 읽을 수만 없는 부류라 숫자 검사로는 안 잡힌다.
      - name: 컬러바 (제목 맞춤 + 눈금 개수)
        run: node scripts/check_colorbar_fit.mjs

      - name: 뷰어 JS 문법
        run: node --check webapp/static/js/viewer3d.js

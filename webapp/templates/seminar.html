{% extends "base.html" %}
{% block title %}연구 세미나{% endblock %}

{% block content %}
<style>
  /* 앱 다크 테마(style.css 의 --bg/--card/--accent …)를 그대로 쓴다.
     ★ 전에 흰 카드를 하드코딩해 앱의 밝은 글자색이 상속돼 회색-on-흰색이 됐다. */
  .sem-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px; }
  .sem-head h1 { margin:0; }
  .sem-sub { color:var(--dim); font-size:.9rem; }

  .sem-tabs { display:flex; gap:8px; margin:14px 0 10px; flex-wrap:wrap; align-items:center; }
  .sem-tabs button { padding:7px 14px; border:1px solid var(--border); background:var(--card);
                     color:var(--dim); cursor:pointer; border-radius:7px; font-size:.9rem;
                     font-family:var(--font); transition:all .12s; }
  .sem-tabs button:hover { color:var(--text); border-color:var(--accent); }
  .sem-tabs button.on { background:var(--accent); color:#0f1117; border-color:var(--accent);
                        font-weight:600; }

  .sem-bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .sem-bar input[type=search] { flex:1 1 280px; padding:8px 12px; border:1px solid var(--border);
        border-radius:7px; font-size:.9rem; background:var(--bg2); color:var(--text);
        font-family:var(--font); }
  .sem-bar input[type=search]:focus { outline:none; border-color:var(--accent); }
  .sem-meta { color:var(--dim); font-size:.82rem; font-family:var(--mono); }

  .sem-toc { background:var(--bg2); border:1px solid var(--border); border-radius:8px;
             padding:10px 14px; margin-bottom:12px; font-size:.85rem;
             max-height:130px; overflow:auto; }
  .sem-toc a { color:var(--accent); text-decoration:none; margin-right:16px; white-space:nowrap;
               line-height:1.9; }
  .sem-toc a:hover { color:var(--accent-hover); text-decoration:underline; }

  .sem-doc { background:var(--card); border:1px solid var(--border); border-radius:10px;
             padding:22px 28px; max-height:70vh; overflow:auto;
             line-height:1.72; font-size:.92rem; color:var(--text); }
  .sem-doc h1 { font-size:1.32rem; color:var(--accent); margin:0 0 16px; padding-bottom:8px;
                border-bottom:1px solid var(--border); }
  .sem-doc h2 { font-size:1.1rem;  color:var(--accent); margin:26px 0 9px; }
  .sem-doc h3 { font-size:.99rem;  color:var(--accent-hover); margin:18px 0 7px; }
  .sem-doc h4 { font-size:.94rem;  color:var(--text); margin:14px 0 6px; }
  .sem-doc p  { margin:8px 0; }
  .sem-doc strong { color:#fff; }
  .sem-doc em { color:var(--dim); }

  .sem-doc table { border-collapse:collapse; margin:12px 0; font-size:.85rem; width:100%; }
  .sem-doc th { background:rgba(108,140,255,.14); color:var(--accent-hover); font-weight:600; }
  .sem-doc th, .sem-doc td { border:1px solid var(--border); padding:6px 9px; text-align:left;
                             vertical-align:top; }
  .sem-doc tbody tr:nth-child(even) { background:rgba(255,255,255,.022); }

  .sem-doc code { background:var(--bg2); color:var(--accent-hover); padding:1px 6px;
                  border-radius:4px; font-family:var(--mono); font-size:.85em; }
  .sem-doc pre { background:var(--bg); border:1px solid var(--border); border-radius:7px;
                 padding:12px 14px; overflow:auto; font-family:var(--mono); font-size:.82rem;
                 color:var(--text); line-height:1.6; }
  .sem-doc pre code { background:none; color:inherit; padding:0; }

  .sem-doc blockquote { border-left:3px solid var(--accent); background:rgba(108,140,255,.07);
                        margin:12px 0; padding:9px 15px; color:var(--text); border-radius:0 6px 6px 0; }
  .sem-doc ul { margin:8px 0; padding-left:22px; }
  .sem-doc li { margin:4px 0; }
  .sem-doc hr { border:0; border-top:1px solid var(--border); margin:22px 0; }
  .sem-doc mark { background:rgba(251,191,36,.32); color:#fde68a; border-radius:3px;
                  padding:0 2px; }
  .sem-doc .warn { color:var(--yellow); font-weight:600; }

  .sem-err { background:rgba(248,113,113,.10); border:1px solid var(--red); color:var(--red);
             border-radius:8px; padding:14px 18px; }

  /* 스크롤바도 테마에 맞춘다 (밝은 기본 스크롤바가 다크에서 튄다) */
  .sem-doc::-webkit-scrollbar, .sem-toc::-webkit-scrollbar { width:9px; height:9px; }
  .sem-doc::-webkit-scrollbar-track, .sem-toc::-webkit-scrollbar-track { background:var(--bg2); }
  .sem-doc::-webkit-scrollbar-thumb, .sem-toc::-webkit-scrollbar-thumb {
      background:var(--border); border-radius:5px; }
  .sem-doc::-webkit-scrollbar-thumb:hover { background:var(--dim); }
</style>

<div class="sem-head">
  <h1>&#x1F5E3;&#xFE0F; 연구 세미나</h1>
  <span class="sem-sub">대본 · 용어집 · 덱 — 파일이 정본이고 이 화면은 뷰어다 (고치면 새로고침으로 반영)</span>
</div>

<div class="sem-tabs" id="semTabs">
  <button data-k="script"   class="on">&#x1F4C4; 슬라이드 대본 + Defense Q&amp;A</button>
  <button data-k="glossary">&#x1F4D6; 용어 · 기호 규약</button>
  <button data-k="guide">&#x1F9ED; 파이프라인 가이드</button>
  <button id="semDeck" style="margin-left:auto">&#x1F4E5; 덱 (.pptx) 내려받기</button>
</div>

<div class="sem-bar">
  <input type="search" id="semFind" placeholder="문서 안에서 찾기 (예: 순환논리, LOOCV, τ, σ_SDCP)">
  <span class="sem-meta" id="semMeta"></span>
</div>

<div class="sem-toc" id="semToc" hidden></div>
<div id="semBody"><div class="sem-doc">불러오는 중…</div></div>

<script>
(function () {
  var body = document.getElementById('semBody'),
      meta = document.getElementById('semMeta'),
      toc  = document.getElementById('semToc'),
      find = document.getElementById('semFind'),
      cache = {}, cur = 'script';

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* 최소 markdown 렌더 — 외부 라이브러리 없이(오프라인 안전).
     표·제목·코드·인용·목록·강조만 처리하고 나머지는 그대로 둔다. */
  function md(src) {
    var out = [], lines = src.split('\n'), i = 0, hid = 0;
    function inline(t) {
      t = esc(t);
      t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
      t = t.replace(/(⚠[^<]{0,80})/g, '<span class="warn">$1</span>');
      return t;
    }
    while (i < lines.length) {
      var L = lines[i];
      if (/^```/.test(L)) {                                   // 코드 블록
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push('<pre>' + esc(buf.join('\n')) + '</pre>'); continue;
      }
      if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])) {
        var rows = [];                                        // 표
        while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
        var head = rows[0].split('|').slice(1, -1),
            rest = rows.slice(2).map(function (r) { return r.split('|').slice(1, -1); });
        out.push('<table><thead><tr>' + head.map(function (c) {
          return '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rest.map(function (r) { return '<tr>' + r.map(function (c) {
            return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table>');
        continue;
      }
      var h = L.match(/^(#{1,4})\s+(.*)$/);
      if (h) { var id = 'h' + (hid++);
        out.push('<h' + h[1].length + ' id="' + id + '">' + inline(h[2]) + '</h' + h[1].length + '>');
        i++; continue; }
      if (/^---+\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(L)) { var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue; }
      if (/^\s*[-*]\s+/.test(L) || /^\s*\d+\.\s+/.test(L)) { var li = [];
        while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i])
               || /^\s{2,}\S/.test(lines[i]))) {
          var m = lines[i].match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
          if (m) li.push('<li>' + inline(m[1]) + '</li>');
          else if (li.length) li[li.length-1] = li[li.length-1].replace('</li>', ' ' + inline(lines[i].trim()) + '</li>');
          i++;
        }
        out.push('<ul>' + li.join('') + '</ul>'); continue; }
      if (!L.trim()) { i++; continue; }
      out.push('<p>' + inline(L) + '</p>'); i++;
    }
    return out.join('\n');
  }

  function buildToc() {
    var hs = body.querySelectorAll('h2');
    if (!hs.length) { toc.hidden = true; return; }
    toc.innerHTML = Array.prototype.map.call(hs, function (h) {
      return '<a href="#' + h.id + '">' + h.textContent.replace(/^[#\s]*/, '') + '</a>';
    }).join('');
    toc.hidden = false;
    toc.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var t = document.getElementById(a.getAttribute('href').slice(1));
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function show(key) {
    cur = key;
    document.querySelectorAll('#semTabs button[data-k]').forEach(function (b) {
      b.classList.toggle('on', b.dataset.k === key); });
    if (cache[key]) { render(cache[key]); return; }
    body.innerHTML = '<div class="sem-doc">불러오는 중…</div>';
    fetch('/api/seminar/doc/' + key).then(function (r) { return r.json(); })
      .then(function (j) { cache[key] = j; render(j); })
      .catch(function (e) {
        body.innerHTML = '<div class="sem-err">불러오기 실패: ' + esc(String(e)) + '</div>'; });
  }

  function render(j) {
    if (!j.ok) {
      body.innerHTML = '<div class="sem-err"><b>' + esc(j.error || '오류') + '</b>' +
        (j.hint ? '<br><small>' + esc(j.hint) + '</small>' : '') + '</div>';
      meta.textContent = ''; toc.hidden = true; return;
    }
    body.innerHTML = '<div class="sem-doc">' + md(j.text) + '</div>';
    meta.textContent = j.path + '  ·  ' + (j.bytes / 1024).toFixed(0) + ' KB';
    buildToc();
    if (find.value) doFind();
  }

  function doFind() {
    var q = find.value.trim();
    var doc = body.querySelector('.sem-doc');
    if (!doc || !cache[cur] || !cache[cur].ok) return;
    doc.innerHTML = md(cache[cur].text);
    if (!q) return;
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), n = 0;
    (function walk(node) {
      for (var c = node.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 3 && re.test(c.nodeValue)) {
          var sp = document.createElement('span');
          sp.innerHTML = esc(c.nodeValue).replace(re, '<mark>$1</mark>');
          n += (c.nodeValue.match(re) || []).length;
          node.replaceChild(sp, c); c = sp;
        } else if (c.nodeType === 1 && c.tagName !== 'MARK') walk(c);
      }
    })(doc);
    meta.textContent = cache[cur].path + '  ·  "' + q + '" ' + n + '건';
    var first = doc.querySelector('mark');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.querySelectorAll('#semTabs button[data-k]').forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.k); }); });
  document.getElementById('semDeck').addEventListener('click', function () {
    fetch('/api/seminar/deck').then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') >= 0) return r.json().then(function (j) {
        alert((j.error || '덱을 찾을 수 없습니다') + (j.hint ? '\n\n' + j.hint : '')); });
      window.location = '/api/seminar/deck';
    });
  });
  var t; find.addEventListener('input', function () { clearTimeout(t); t = setTimeout(doFind, 220); });

  show('script');
})();
</script>
{% endblock %}

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>にほんちず — 눌러 보는 일본 지도 🗾</title>
  <meta name="description" content="지도에서 県을 톡 누르면 명물·관광지 메모랑 그 지역 캐릭터가 튀어나와요. 한자 읽는 법이랑 한국어 풀이도 ✿" />
  <meta name="theme-color" content="#FBF7EE" />
  <!-- link previews (KakaoTalk and the like): the card is tools/og-card.mjs → public/og.png; bump ?v= when it changes -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="にほんちず" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://nihoncheese.bmlwork.kr/" />
  <meta property="og:title" content="にほんちず — 눌러 보는 일본 지도 🗾" />
  <meta property="og:description" content="지도에서 県을 톡 누르면 명물·관광지 메모랑 그 지역 캐릭터가 튀어나와요. 한자 읽는 법이랑 한국어 풀이도 ✿" />
  <meta property="og:image" content="https://nihoncheese.bmlwork.kr/og.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="크림색 종이에 마스킹테이프로 붙인 파스텔 일본 지도와 「にほんちず — 눌러 보는 일본 지도」 글씨" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="brand" id="brand" type="button" title="벚꽃 🌸">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <span class="brand__title" lang="ja">にほんちず</span>
          <span class="brand__sub">일본 지도 노트</span>
        </span>
      </button>

      <div class="search" id="search">
        <label class="search__box">
          <span class="search__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          </span>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="県をさがす · 교토, きょうと, Kyoto…" aria-label="도도부현 검색" aria-controls="search-results" aria-expanded="false" />
        </label>
        <ul class="search__results" id="search-results" role="listbox" hidden></ul>
      </div>

      <div class="topbar__right">
        <div class="seg" role="radiogroup" aria-label="지도 라벨 표기" id="label-mode">
          <button type="button" role="radio" aria-checked="true" data-mode="furi" lang="ja" title="漢字 + よみ">ふりがな</button>
          <button type="button" role="radio" aria-checked="false" data-mode="ja" lang="ja">漢字</button>
          <button type="button" role="radio" aria-checked="false" data-mode="kana" lang="ja">かな</button>
          <button type="button" role="radio" aria-checked="false" data-mode="ko">한글</button>
        </div>
        <button class="pill pill--book" id="collection-btn" type="button" aria-haspopup="dialog">
          <span class="pill__icon" aria-hidden="true">✦</span>
          <span lang="ja">図鑑</span>
          <span class="pill__count" id="collection-count">0/21</span>
        </button>
        <button class="pill pill--matsuri" id="matsuri-btn" type="button" aria-haspopup="dialog" title="축제 달력 — 달마다 어디로 갈까 (내 마인드맵 · 보충의 축제 + 유명 축제 · 벚꽃 · 단풍 시즌)">
          <span class="pill__icon" aria-hidden="true">🎆</span>
          <span>축제</span>
        </button>
        <button class="pill pill--memo" id="memo-btn" type="button" aria-haspopup="dialog">
          <span class="pill__icon" aria-hidden="true">✎</span>
          <span>메모장</span>
        </button>
        <button class="pill pill--comment" id="comment-btn" type="button" aria-haspopup="dialog" title="「뭐뭐 넣어줘!」 — 누구나 쓰고, 모두가 봐요">
          <span class="pill__icon" aria-hidden="true">💬</span>
          <span lang="ja">コメント</span>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="map" id="map" aria-label="일본 지도" role="application"></div>
      <div class="map-loading" id="map-loading" aria-live="polite">지도를 펼치는 중…</div>
      <div class="fx-layer" id="fx" aria-hidden="true"></div>

      <div class="legend" id="legend" aria-label="지방"></div>

      <div class="layers" id="layers" role="group" aria-label="지도 레이어">
        <button type="button" data-layer="cities" aria-pressed="true" title="일본 지도(시 포함) — ◎ 県庁所在地 · ● 볼거리 있는 곳(패널에 칸이 있는 도시·명소) · ○ 이름만 적어 둔 도시는 회색, 더 확대해야 이름 · 확대하면 내 마인드맵 · 보충의 랜드마크가 닮은꼴 스티커로 (누르면 그 칸)"><span class="layers__ico" aria-hidden="true">📍</span>도시</button>
        <button type="button" data-layer="bridges" aria-pressed="true" title="四国につなぐ大きな橋 — 本州 ↔ 四国 다리 3개 · 本州 ↔ 北海道 青函トンネル (津軽海峡大橋 는 구상만)"><span class="layers__ico" aria-hidden="true">🌉</span>다리</button>
        <button type="button" data-layer="transit" aria-pressed="false" title="가는 법 모드 — 🚄 신칸센 11개 노선에 번호, 목록에서 누르면 그 노선으로 · ✈ 공항 (국제 관문은 늘, 나머지는 확대하면). 다시 누르면 끔"><span class="layers__ico" aria-hidden="true">🚄</span>가는 법</button>
        <button type="button" data-layer="mountains" aria-pressed="false" title="일본 지도(산맥) — 高い山脈・山地・高地 (학습지 22개)"><span class="layers__ico" aria-hidden="true">⛰</span>산맥</button>
      </div>

      <div class="zoomctl" aria-label="지도 확대/축소">
        <button type="button" id="zoom-in" aria-label="확대">+</button>
        <button type="button" id="zoom-out" aria-label="축소">−</button>
        <button type="button" id="zoom-reset" aria-label="전체 보기" title="전체 보기">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        </button>
      </div>

      <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
      <div class="mascot-layer" id="mascot-layer" aria-live="polite"></div>
      <div class="petals" id="petals" aria-hidden="true" hidden></div>
      <p class="credit">地図: 地球地図日本（国土地理院）· 市域: 国土数値情報（行政区域データ）（国土交通省）を加工して作成 · <span lang="ja">にほんちず</span> ✿</p>
    </main>

    <aside class="panel" id="panel" aria-label="상세 정보" aria-hidden="true">
      <div class="panel__tape" aria-hidden="true"></div>
      <button class="panel__close" id="panel-close" type="button" aria-label="닫기">×</button>
      <div class="panel__scroll" id="panel-body"></div>
    </aside>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal__backdrop" data-close></div>
      <div class="modal__card">
        <button class="modal__close" type="button" aria-label="닫기" data-close>×</button>
        <div class="modal__body" id="modal-body"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

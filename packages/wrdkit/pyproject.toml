[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrdkit"
version = "0.1.0"
description = "Read and analyse WonATech / Zive .wrd battery cycler files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "openpyxl>=3.1", "ruff>=0.6"]

[project.scripts]
wrdkit = "wrdkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

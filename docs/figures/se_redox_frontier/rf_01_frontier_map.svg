   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c05621" x="256.973607" y="198.6079" transform="rotate(-0 256.973607 198.6079)">free S²⁻ lone pairs (4a/4d)</text>

# =====================================================================
# 저널 Impact Factor 테이블
#   source : JCR 2024 (2025년 6월 발표) 기준 근사값. 매년 6월 갱신할 것.
#   match  : 소문자 정규화 후 정확 일치 → 별칭(aliases) → 부분 일치 순으로 매칭
#   IF 값은 우선순위 정렬용 근사값이며 공식 수치는 Clarivate JCR을 확인.
# =====================================================================
updated: "2025-06"
default_if: 3.0
preprint_servers: ["arxiv", "chemrxiv", "biorxiv", "ssrn", "research square", "preprints.org"]


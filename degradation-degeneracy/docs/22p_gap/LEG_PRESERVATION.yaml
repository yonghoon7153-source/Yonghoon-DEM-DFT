# warm-probe 다리의 **실제 보존 상태**와 투영 cohort — 계약 v4 §8 의 실체
#
# 왜 이 파일이 있나 (2026-08-24):
#   작업 기계가 교체되면서 `results/` 가 사라졌다. 그 전까지 문서는 8다리를
#   전부 "원자료 보유 기계에서 되살릴 수 있다" 로 적고 있었다. **틀린 상태가
#   문서에 있었다.** 복구 전수 조사에서 `paired_fixed5_v4` 하나만 살아남았다.
#
# 이 파일이 담는 것은 **이미 실행된 다리**뿐이다. 아직 실행하지 않은 계획
# 다리는 여기 오지 않는다 — `planned_leg_index` 가 그것이고 계약 v4 묶음 1·9 다
# (25차 발견 5: 계획 다리를 `missing/unvalidated/excluded` 로 적으면 "과학적으로
# 폐기됨" 처럼 읽힌다. 초판이 그렇게 시켰고 틀렸다).
#
# 3축 enum 과 허용 제약의 정본은 `STAGE3_CONTRACT.md` §8 하나다 — 여기 옮겨
# 적지 않는다. claim ID 의 정본은 `CLAIM_STATUS.yaml` 하나다.
schema_version: 3
recorded: 2026-08-25
recorded_on: "새 작업 기계 복구 조사 + 컨테이너 재검증"

# ── 투영 cohort ──────────────────────────────────────────────────────────
# ★ 25차 발견 1 — 투영을 전역 pin 하나로 묶으면 analyzer 를 고치는 순간
#   충족 불가능해진다. 원자료를 잃은 7다리는 새 analyzer 로 재생성할 수 없고,
#   살아 있는 다리만 재생성하면 "여덟이 한 세대" 회귀가 깨진다. 어느 쪽으로도
#   suite 를 만족시킬 수 없었다.
#
#   그래서 cohort 로 나눈다. 옛 여덟 투영은 **immutable historical cohort** 로
#   얼리고, 새 투영은 새 cohort_id 와 **새 경로**에 쓴다. 옛 바이트를 덮지
#   않는다. 교차-다리 비교는 **같은 cohort 안에서만** 성립한다.
#
#   `runtime` 은 기록이지 equality 축이 아니다. g1 은 py3.12.3/numpy 2.5.2,
#   g2 는 py3.11.15/numpy 2.4.6 에서 만들었는데 `projection_sha256` ·
#   `restart_projection_sha256` 이 **바이트 동일**하다 (아래 두 pin 이 그
#   증거다). runtime 을 digest 에 넣으면 그 성질을 잃는다.
cohorts:
  - cohort_id: g1_2026_08_20
    dir: docs/22p_gap/warm_probe
    status: frozen
    frozen_reason: >-
      8다리 중 7다리의 원자료가 소실됐다. 이 cohort 는 다시 만들 수 없으므로
      기록된 analyzer 바이트에 대고만 검증한다. 25차 발견 2 로 analyzer 가
      g2 로 올라갔지만 이 cohort 는 g1 바이트 그대로 얼린다.
    cross_leg_comparison: allowed_within_cohort
    pin:
      schema_version: 3
      compute_sha256: 73c1ac4ba06e59dc
      row_projection_py_sha256: bbb4744256e42b8f
      src_scoring_py_sha256: 69e69cb046f4b4ae
      analysis_spec_sha256: f1898eb6117c89b8e43b9d7c76ba4c2abb1cc880f36ccbbdd8d6d329cf4cf727
    runtime: {python: "3.12.3", pandas: "3.0.5", pyarrow: "25.0.1",
              numpy: "2.5.2", yaml: "6.0.3"}
    legs: [fit_22p_seed_404_hc, fit_22p_seed_404_hc_nowarm,
           fit_22p_seed_404_hc_warm_now, fit_seed404_pe5mv,
           fit_seed404_pe5mv_nowarm, paired_fixed5_v4,
           paired_fixed5_v4_nowarm_now, paired_fixed5_v4_warm]

  - cohort_id: g2_2026_08_25
    dir: docs/22p_gap/proj_g2
    status: active
    cross_leg_comparison: not_applicable_single_leg
    무엇이_달라졌나: >-
      계산 digest 를 손으로 고른 함수 목록이 아니라 **dependency closure** 에서
      만든다 (25차 발견 2 — `_RESTART_SOURCES` 가 digest 밖에 있었다).
      행 바이트는 안 움직였다: 이 cohort 의 `projection_sha256` ·
      `restart_projection_sha256` · `fits_sha256` 이 g1 과 바이트 동일하다.
    analysis_spec_이_g1과_다른_이유: >-
      ★ 29차 P1-4 — spec 이 **거짓을 선언하고 있었다.** 이력은 이렇다:
      23차(`f49cd66e`)에는 비교기가 실제로 `{_채점원본, _F4_주의}` 둘 다 뗐고
      spec 의 `skip_top_level_keys` 도 그대로였다 — 그때는 참이었다. 28차에
      `SEMANTIC_SKIP = ("_채점원본",)` 로 비교기를 **좁혔지만 spec 선언은 그대로
      뒀다.** 직전 커밋 `2e505317` 에서 확인된다: `_SKIP = set(SEMANTIC_SKIP)`
      인데 spec 은 여전히 `[_채점원본, _F4_주의]` 였다. 즉
      `analysis_spec_sha256` 이 실제 비교 규칙과 무관한 값을 앵커라고 부르고
      있었다. 이제 spec 이 `SEMANTIC_SKIP` 을 그대로 읽으므로 선언과 구현이
      한 값이고, 그 결과 digest 가 `f1898eb6…` → `43d74dd3…` 로 움직였다.
      비교 규칙 자체는 28차 이후 그대로다 — 움직인 것은 **선언**이다.
      `_F4_주의` 의 인용 금지 flag 는 `make_receipt._citation_safety` 가 값으로
      따로 검사한다. cross-cohort 비교는 어차피 금지다
      (`cross_leg_comparison` 참조).
    pin:
      schema_version: 3
      compute_sha256: ea7a0c1964eb4c3f
      row_projection_py_sha256: 38749bd2def6f98e
      src_scoring_py_sha256: 69e69cb046f4b4ae
      analysis_spec_sha256: 43d74dd385b1f66d28cc371dd7ebbd00fc0289323e0a515114eb2b8d45d56271
    runtime: {python: "3.11.15", pandas: "3.0.5", pyarrow: "25.0.1",
              numpy: "2.4.6", yaml: "6.0.3"}
    legs: [paired_fixed5_v4]

legs:
  # ── 원자료가 살아남은 유일한 다리 ────────────────────────────────────────
  - leg_id: paired_fixed5_v4
    preservation_status: full_bundle
    validation_status: historical_validated
    inference_role: diagnostic
    근거: >-
      2026-08-16 백업 `v4_run_extras` 에서 복구. `validate_provenance` 34검사
      전부 통과 (ok=True, fail=[]). 다만 **현행 정본은 아니다**: run_spec 이
      `source_digest: d50295f980ccaa81` 로 현행과 다르고, `코드_identity` 검사는
      (`src/io.py:1514`) run_spec 이 digest 를 갖고 dirty 가 아닌지만 본다 —
      현행 트리와의 일치를 보지 않는다. 그래서 `historical_validated` 다.
      전이표도 현행 digest 짝과 다르다 (133/429/56/858, Δ 0.252710 vs
      131/436/55/854, Δ 0.258130) → 현행 1차 표의 대체물이 아니다.
    evidence:
      bundle_uri: artifacts/paired_fixed5_v4          # git tracked
      bundle_files: 26
      payload_bytes: 23863555
      payload_index: artifacts/paired_fixed5_v4/payload_sha256.yaml
      payload_index_sha256: eeb8ae8911083c992710ace2c8f255682b64930a03929f12ae72796ade174716
      # ★ 25차 발견 3 — 산문이 아니라 회귀가 `tools/archive_bundle.check()` 를
      #   **호출해서** member 를 전수 재해시한다. 크기를 유지한 1비트 반전을
      #   옛 검사가 통과했다.
      member_rehash_by: tools.archive_bundle.check
      # ★ 25차 발견 4 — 영수증은 손으로 쓰지 않는다.
      #   `python3 docs/22p_gap/make_receipt.py paired_fixed5_v4` 가 만들고
      #   `--check` 가 **core 바이트 동일** 재생성을 확인한다. core 는 묶음
      #   바이트와 validator 소스에서만 나오므로 언제 어디서 돌려도 같다 —
      #   commit SHA·실행 시각·dirty 여부는 stamp 로 뺐다 (그것들을 core 에
      #   두면 커밋된 영수증이 원리적으로 재생 불가능해진다).
      verification_receipt: docs/22p_gap/receipts/paired_fixed5_v4.validate.yaml
      verification_receipt_core_sha256: bff345f6b2f1a12b8b7bd67fb974e9c037ae462758b5459cbee6ebaaf4a9fa94
      verification_receipt_generator: docs/22p_gap/make_receipt.py
      empty_root_restore: true       # 원본 results/ 에 접근하지 않고 복원해 검증
      rescored_from_restored_fits: true
      validator_identity:
        source_digest: ae4d82faf6c2281f
        n_checks: 34
        ok: true
      leg_source_digest: d50295f980ccaa81            # 산출물 쪽 (옛 세대)
      fits_sha256: e033b19510ddbed951cfebe7e28793f19c5f0da915268b0731a30c56f0b3b064
      fits_봉인일치: true
      cohorts: [g1_2026_08_20, g2_2026_08_25]
      regeneration_capability: available_raw_present
    claim_roles:
      - claim_id: LEGACY_PAIRED_FIXED5
        inference_role: canonical
      - claim_id: P22_STAGE3_PRIMARY
        inference_role: diagnostic
        reason: v5_to_v6_promotion_forbidden   # 세대를 넘어 쓸 수 없다는 근거
      - claim_id: P22_NOWARM_PRIMARY
        inference_role: excluded
        reason: 옛 digest — 전이표 값이 다르다
    함께_복구: [grid_curves_v4, grid_fit_v4, halfcell_fit_v4]

  # ── 2026-08-20 warm 실험 7다리. 원자료 소실, 투영은 g1 에 얼려 있다 ──────

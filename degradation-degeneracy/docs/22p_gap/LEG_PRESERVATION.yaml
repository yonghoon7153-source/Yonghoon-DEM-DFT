    \ 47차 `producer_semantic_sha256` 의 네 구멍을 짚었고, 넷을 다 막으면서 값이 `908503e65162e7d9`\
    \ → `bbb1c4d6fc982610` 로 움직였다:\n(1) 닫힘이 `row_projection.py` 안에서 멈춰 `src.scoring`\
    \ 의 채점 함수를\n    안 봤다 — 채점 의미를 통째로 바꿔도 digest 가 안 움직였다.\n(2) `ast.get_source_segment`\
    \ 이 `decorator_list` 를 버렸다 —\n    `@lru_cache` 를 붙이고 떼도 같은 값이었다.\n(3) `_PRODUCER_CUT`\
    \ 이 **넓어지는** 것은 막히지 않았다 (좁아지는 것만\n    fail-closed 였다).\n(4) 정규형이 인터프리터 버전에 묶여\
    \ 있었다. 실측: 같은 바이트에 대해\n    3.11 `908503e65162e7d9` · 3.12 `d4ae1c027b434e83` ·\n\
    \    3.13 `aa1cf2cf045c41ea` — 세 값이었다. 지금은 3.10~3.13 이\n    같은 값을 낸다 (회귀가 이 기계에서\
    \ 대조한다).\n\n계약 §13.3.2 대로 pin 은 cohort lifetime 동안 고정이므로 g2 를 얼리고 **새 cohort ID\
    \ + 새 출력 디렉터리**로 간다. g2 의 바이트와 pin 은 그대로 두었다 — 얼린 것을 손대지 않는다."

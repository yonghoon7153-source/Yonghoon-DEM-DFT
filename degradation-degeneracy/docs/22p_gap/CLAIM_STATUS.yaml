      모순된다 — 판정선 6%p 의 ≥4%p 놓침이 `203/518 = 39.2%` 다. 20차 발견 7.

      ★ 초판 regex 가 "두 오류가 동시에 ~1%" 를 금지했는데 **틀렸다** (22차
        자체 발견). 그 관측은 철회 대상이 아니라 배너가 명시적으로 **유지**하는
        것이다 ("표가 지지하는 것은 2.5~3%p 부근의 좁은 운용 창뿐"). 철회된
        주장에 인접한 참인 문장을 금지하면 원장이 문서를 거짓으로 만든다.
    files: [docs/09_22P_GAP.md]
    banned:
      # ★★ 이 regex 는 두 번 틀렸다 (22차 자체 발견). 초판은 "두 오류가 동시에
      #   ~1%" 를, 2판은 "판정선을 어디에 두든" 을 금지했는데 둘 다 **철회되지
      #   않은 참인 문장**을 잡았다 (§0 의 "판정선을 어디에 두든 고칠 수 없다"
      #   는 정반대 주장이다). 금지어는 **철회된 의미**에 묶여야 한다.
      - '판정선을\s*어디에\s*두든\s*성능'
      - '문턱(에|과)\s*(관계|상관)\s*없이\s*성능'
      - '어디에\s*두든\s*성능이\s*유지'


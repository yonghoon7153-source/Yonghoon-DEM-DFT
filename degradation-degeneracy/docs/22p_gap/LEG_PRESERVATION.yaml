  무엇이_달라졌나: '계산 digest 를 손으로 고른 함수 목록이 아니라 **dependency closure** 에서 만든다 (25차 발견 2
    — `_RESTART_SOURCES` 가 digest 밖에 있었다). 행 바이트는 안 움직였다: 이 cohort 의 `projection_sha256`
    · `restart_projection_sha256` · `fits_sha256` 이 g1 과 바이트 동일하다.'
  analysis_spec_이_g1과_다른_이유: '★ 29차 P1-4 — spec 이 **거짓을 선언하고 있었다.** 이력은 이렇다: 23차(`f49cd66e`)에는
    비교기가 실제로 `{_채점원본, _F4_주의}` 둘 다 뗐고 spec 의 `skip_top_level_keys` 도 그대로였다 — 그때는 참이었다.
    28차에 `SEMANTIC_SKIP = ("_채점원본",)` 로 비교기를 **좁혔지만 spec 선언은 그대로 뒀다.** 직전 커밋 `2e505317`
    에서 확인된다: `_SKIP = set(SEMANTIC_SKIP)` 인데 spec 은 여전히 `[_채점원본, _F4_주의]` 였다. 즉 `analysis_spec_sha256`
    이 실제 비교 규칙과 무관한 값을 앵커라고 부르고 있었다. 이제 spec 이 `SEMANTIC_SKIP` 을 그대로 읽으므로 선언과 구현이
    한 값이고, 그 결과 digest 가 `f1898eb6…` → `43d74dd3…` 로 움직였다. 비교 규칙 자체는 28차 이후 그대로다 —
    움직인 것은 **선언**이다. `_F4_주의` 의 인용 금지 flag 는 `make_receipt._citation_safety` 가 값으로
    따로 검사한다. cross-cohort 비교는 어차피 금지다 (`cross_leg_comparison` 참조).'

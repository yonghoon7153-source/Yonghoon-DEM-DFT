    을 읽으면 그 산문이 의미가 된다 — 버린 것을 쓰는 코드는 fail-closed 다. (3) `SUPPORTED_PYTHON` 이 3.12 를 선언하는데 정규형이 3.12 에서
    실제로 달랐다 (PEP 701 파서가 중첩 format spec 끝에 빈 `Constant('''')` 를 붙인다) — 정규형이 그 빈 조각을 흡수하게 했고 이제 3.11·3.12·3.13
    이 같은 값을 낸다. (4) `build()` 의 frozen 목적지 판정이 원자료 존재 검사 뒤에 있었다 — 거절은 아무 일도 하기 전에 나야 하므로 맨 앞으로 옮겼다. 넷을
    다 고치면서 `producer_semantic_sha256` 이 `b4701aa33264a753` → `0217b906f6b8bf42` 로 움직였다. 계약 §13.3.2 대로
    pin 은 cohort lifetime 동안 고정이므로 g4 를 얼리고 `g5_2026_08_29` 로 간다. **행 바이트는 안 움직였다** — 움직인 것은 identity
    의 정의다.'

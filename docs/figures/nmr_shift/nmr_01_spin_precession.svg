<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" role="img" aria-label="Nuclear spin precessing in the field B0; frequency proportional to the field">
<style>
text{font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#1f2937}
.mono{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;font-size:14px}
.note{font-size:13.5px;fill:#6b7280}
.li{fill:#0d9488} .p{fill:#7c3aed} .nd{fill:#db2777} .fld{fill:#2563eb} .wht{fill:#ffffff}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.guide{stroke:#6b7280;stroke-width:1;stroke-dasharray:3 4;fill:none}
.trace{fill:none;stroke-width:2.2;stroke-linejoin:round}
</style>
<rect x="0.5" y="0.5" width="539" height="199" rx="8" fill="#ffffff" stroke="#d3dcdc"/>
<defs><marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<line x1="40" y1="185" x2="40" y2="30" stroke="#2563eb" stroke-width="2" marker-end="url(#af)"/>
<line x1="70" y1="185" x2="70" y2="30" stroke="#2563eb" stroke-width="2" marker-end="url(#af)"/>
<line x1="100" y1="185" x2="100" y2="30" stroke="#2563eb" stroke-width="2" marker-end="url(#af)"/>
<text class="fld" x="70" y="22" text-anchor="middle">B₀</text>
<ellipse cx="250" cy="58" rx="56" ry="13" fill="none" stroke="#6b7280" stroke-dasharray="4 4"/>
<line x1="250" y1="132" x2="194" y2="58" stroke="#6b7280" stroke-dasharray="4 4"/>
<line x1="250" y1="132" x2="306" y2="58" stroke="#6b7280" stroke-dasharray="4 4"/>
<line x1="250" y1="132" x2="292" y2="66" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/>
<circle cx="250" cy="132" r="17" fill="#0d9488"/>
<text class="wht" x="250" y="137" text-anchor="middle" style="font-size:12px">⁷Li</text>
<text x="335" y="52">spin precesses</text>
<text class="mono" x="335" y="74">f = γ·B / 2π</text>
<text class="note" x="335" y="108">at 9.4 T</text>
<text class="mono" x="335" y="130">¹H   400.2 MHz</text>
<text class="mono li" x="335" y="152">⁷Li  155.5 MHz</text>
<text class="mono p" x="335" y="174">³¹P  162.0 MHz</text>
</svg>

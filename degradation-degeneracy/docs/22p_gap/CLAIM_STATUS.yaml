            docs/22p_gap/STAGE3_CONTRACT.md]
    banned:
      # ★ 23차 리뷰가 **이 regex 자신의 구멍**을 지적했다. 아래 넷은 실제로
      #   활성 본문에 남아 빠져나간 형태다 — 조사(를/가)와 어미(더한/늘어난/
      #   더했을)가 초판 패턴의 인접 단어 가정을 깼다. 21차 NOISE_INERT 때
      #   배운 것과 같은 교훈이다: **철회된 의미**에 묶어라.
      - '점\s*하나를?\s*(더한|더했|늘)'
      - '후보\s*하나를?\s*(더한|더했|추가|늘)'
      - '(결정론적\s*)?(후보|점)\s*하나가?\s*늘어'
      - '후보\s*집합에\s*.{0,12}(추가|늘)'
      - '그\s*추가\s*후보'
      - '추가된\s*(warm\s*)?후보'


#
#   그래서 세대를 여기 못 박는다. 원자료 없는 다리는 **기록된 세대 바이트**에
#   대고 검사한다. 원자료가 있는 다리만 현행 트리에 대고 검사한다.
#
#   `comparison_set_status` 는 8다리 **교차** 비교(전이표 대조·짝 재현·
#   교차-digest 재현)가 아직 "같은 규격끼리" 인가를 선언한다. 분석기를 고치는
#   순간 그 전제가 깨지고, 회귀가 먼저 실패해서 선언을 강제한다 — 조용히
#   깨지지 않는다.
